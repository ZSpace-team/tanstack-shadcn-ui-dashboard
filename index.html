<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Template</title>
    <script>
      // Áp theme + tông màu + font trước khi React mount để tránh nháy màu/nháy chữ.
      (function () {
        try {
          var theme = localStorage.getItem("admin-template-theme");
          var isDark =
            theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");

          var accent = localStorage.getItem("admin-template-accent");
          if (["coral", "amber", "emerald", "teal", "blue", "violet"].indexOf(accent) !== -1) {
            document.documentElement.dataset.accent = accent;
          }

          var font = localStorage.getItem("admin-template-font");
          if (font === "be-vietnam-pro" || font === "inter" || font === "system") {
            document.documentElement.dataset.font = font;
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
